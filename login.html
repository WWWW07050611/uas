<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>翼博云添 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f6f8f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            width: 420px;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-title h1 {
            color: #238b50;
            font-size: 28px;
        }
        .login-title p {
            color: #666;
            margin-top: 6px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-item input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-item input:focus {
            outline: none;
            border-color: #238b50;
        }
        .tip-error {
            color: #e03e3e;
            font-size:14px;
            height:20px;
            text-align:center;
            margin-bottom:12px;
        }
        #loginBtn {
            width: 100%;
            height: 48px;
            background-color: #238b50;
            color: white;
            border: none;
            border-radius:8px;
            font-size:17px;
            cursor: pointer;
        }
        #loginBtn:hover {
            background-color:#1d7542;
        }
        .account-desc{
            margin-top:24px;
            font-size:14px;
            color:#555;
            border-top:1px solid #eee;
            padding-top:20px;
        }
        .account-desc p{
            line-height:1.7;
        }
        /* 账号信息卡片样式 */
        .account-info{
            margin-top:16px;
            background-color:#f0f7f3;
            padding:14px;
            border-radius:10px;
        }
        .account-info h4{
            color:#238b50;
            margin-bottom:10px;
            font-size:15px;
        }
        .acc-row{
            display:flex;
            justify-content:space-between;
            padding:4px 0;
            font-size:14px;
            color:#333;
        }
        .back-home-top {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 8px 16px;
            background-color: #238b50;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            z-index: 999;
        }
        .back-home-top:hover {
            background-color: #1e7844;
        }
    </style>
</head>
<body>
<a href="index.html" class="back-home-top">返回首页</a>
    <div class="login-card">
        <div class="login-title">
            <h1>翼博云添</h1>
            <p>三端协同平台登录</p>
        </div>
        <div class="form-item">
            <label>账号</label>
            <input id="username" placeholder="请输入账号">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input id="password" type="password" placeholder="请输入密码">
        </div>
        <div class="tip-error" id="errorTip"></div>
        <button id="loginBtn">登录</button>

        <div class="account-info">
            <h4>📋 演示账号（仅用于项目演示）</h4>
            <div class="acc-row"><span>农户端</span><span>账号：farmer｜密码：123456</span></div>
            <div class="acc-row"><span>飞手端</span><span>账号：pilot｜密码：123456</span></div>
            <div class="acc-row"><span>管理后台</span><span>账号：admin｜密码：123456</span></div>
        </div>

        <div class="account-desc">
            <p>💡提示：登录后根据账号自动跳转对应页面，刷新页面不会丢失登录身份。</p>
        </div>
    </div>
    <script>
        const userMap = {
            farmer: {pwd:"123456", page:"farmer.html"},
            pilot: {pwd:"123456", page:"pilot.html"},
            admin: {pwd:"123456", page:"admin.html"}
        }
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorTip = document.getElementById('errorTip');

        function login(){
            const name = usernameInput.value.trim();
            const pwd = passwordInput.value.trim();
            errorTip.textContent = "";
            if(!userMap[name]){
                errorTip.textContent="账号不存在";
                return;
            }
            if(userMap[name].pwd !== pwd){
                errorTip.textContent="账号或密码错误";
                return;
            }
            //保存登录角色
            localStorage.setItem("userRole", name);
            window.location.href = userMap[name].page;
        }
        loginBtn.addEventListener("click", login);
        passwordInput.addEventListener("keydown",(e)=>{
            if(e.key === 'Enter') login();
        })
    </script>
</body>
</html>
